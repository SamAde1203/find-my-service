name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_evals:
        description: "Also run the evaluations against Claude (uses the ANTHROPIC_API_KEY secret and costs a few pence)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests && ruff format --check src tests
      - name: Types (mypy, strict)
        run: mypy src
      - name: Tests (pytest)
        run: pytest

  evals:
    name: Evaluations
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Main set (no AI, deterministic)
        run: fms-evals --report evals/report.md
      - name: Held-out set (no AI)
        if: always()
        run: fms-evals --cases evals/holdout.yaml --report evals/report-holdout.md
      - name: Live evaluation with Claude
        if: inputs.live_evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: fms-evals --provider anthropic --report evals/report-claude.md
      - name: Add reports to the run summary
        if: always()
        run: cat evals/report*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: evaluation-reports
          path: evals/report*.md

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t find-my-service .
      - name: Start and check health
        run: |
          docker run -d --name fms -p 8000:8000 find-my-service
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8000/ready && break; sleep 1; done
          curl -fs -X POST http://127.0.0.1:8000/api/ask \
            -H 'content-type: application/json' \
            -d '{"question": "How much is a resident parking permit?"}' | tee /tmp/answer.json
          grep -q '£60' /tmp/answer.json
